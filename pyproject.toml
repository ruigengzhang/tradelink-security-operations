[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradelink-security-operations"
version = "1.0.0"
description = "A reproducible cross-border marketplace SOC detection and incident response lab"
requires-python = ">=3.10"

[project.scripts]
tradelink-soc = "tradelink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
